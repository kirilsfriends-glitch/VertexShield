name: Download Workupload File

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Download, verify, and commit file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          FILE_ID="eazJAJgVwmh"
          FILE_NAME="neverwork.dll"
          EXPECTED_SIZE="35810816"
          EXPECTED_SHA256="57f632b9430e5ccd574de3381f670d30f99af2d68f119330e3a3c11d417754d0"
          BASE_URL="https://workupload.com"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          DEBUG_LOG="workupload-download.log"

          exec > >(tee "$DEBUG_LOG") 2>&1
          echo "Branch: ${BRANCH_NAME}"
          echo "GitHub ref: ${GITHUB_REF_NAME}"
          echo "Date: $(date -u --iso-8601=seconds)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" /tmp/workupload_page.html /tmp/workupload_start.bin /tmp/workupload_api.json /tmp/workupload_download_headers.txt /tmp/workupload_puzzle.json /tmp/workupload_captcha.txt /tmp/workupload_captcha_response.json /tmp/workupload_comment.md' EXIT

          result=0
          (
            set -euxo pipefail

            fetch_file_page() {
              curl -v -L --retry 3 --retry-delay 2 \
                -A "$UA" \
                -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
                "${BASE_URL}/file/${FILE_ID}" \
                -o /tmp/workupload_page.html
            }

            page_has_security_check() {
              grep -Eiq 'Are you a human|Security Check|/puzzle|/captcha' /tmp/workupload_page.html
            }

            solve_security_check() {
              fetch_file_page
              if ! page_has_security_check; then
                echo "No Workupload security check detected."
                return 0
              fi

              echo "Workupload security check detected; solving proof-of-work captcha."
              for attempt in 1 2 3 4 5; do
                echo "Captcha attempt ${attempt}"
                curl -v -L --retry 3 --retry-delay 2 \
                  -A "$UA" \
                  -e "${BASE_URL}/file/${FILE_ID}" \
                  -H 'X-Requested-With: XMLHttpRequest' \
                  -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
                  "${BASE_URL}/puzzle" \
                  -o /tmp/workupload_puzzle.json
                echo "Puzzle response:"
                cat /tmp/workupload_puzzle.json
                echo

                python3 - <<'PY' > /tmp/workupload_captcha.txt
          import hashlib, json
          from pathlib import Path

          data = json.loads(Path('/tmp/workupload_puzzle.json').read_text())
          payload = data.get('data') or {}
          puzzle = str(payload['puzzle'])
          wanted = set(payload['find'])
          limit = int(payload['range'])

          found = []
          for i in range(limit):
              digest = hashlib.sha256((puzzle + str(i)).encode()).hexdigest()
              if digest in wanted:
                  found.append(str(i))
                  if len(found) == len(wanted):
                      break

          if len(found) != len(wanted):
              raise SystemExit(f'Only found {len(found)} of {len(wanted)} captcha values')

          print(' '.join(found) + ' ')
          PY
                echo "Captcha answer: $(cat /tmp/workupload_captcha.txt)"

                curl -v -L --retry 3 --retry-delay 2 \
                  -A "$UA" \
                  -e "${BASE_URL}/file/${FILE_ID}" \
                  -H 'X-Requested-With: XMLHttpRequest' \
                  -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
                  -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
                  --data-urlencode "captcha=$(cat /tmp/workupload_captcha.txt)" \
                  "${BASE_URL}/captcha" \
                  -o /tmp/workupload_captcha_response.json
                echo "Captcha response:"
                cat /tmp/workupload_captcha_response.json || true
                echo

                sleep 1
                fetch_file_page
                if ! page_has_security_check; then
                  echo "Security check solved."
                  return 0
                fi
              done

              echo "Security check is still present after all attempts."
              return 1
            }

            solve_security_check
            echo "Page preview after security check:"
            head -c 300 /tmp/workupload_page.html || true
            echo

            echo "Calling start endpoint..."
            curl -v --retry 3 --retry-delay 2 \
              -A "$UA" \
              -e "${BASE_URL}/file/${FILE_ID}" \
              -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              "${BASE_URL}/start/${FILE_ID}" \
              -o /tmp/workupload_start.bin || true

            echo "Resolving download server..."
            curl -v -L --retry 3 --retry-delay 2 \
              -A "$UA" \
              -e "${BASE_URL}/file/${FILE_ID}" \
              -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              "${BASE_URL}/api/file/getDownloadServer/${FILE_ID}" \
              -o /tmp/workupload_api.json
            echo "API response:"
            cat /tmp/workupload_api.json
            echo

            DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/workupload_api.json').read_text())
          if not data.get('success'):
              raise SystemExit(f"Workupload API failed: {data}")
          print(data['data']['url'].replace('\\/', '/'))
          PY
            )"
            echo "Download URL: ${DOWNLOAD_URL}"

            echo "Downloading ${FILE_NAME}..."
            rm -f "$FILE_NAME"
            curl -v -L --fail --retry 3 --retry-delay 3 \
              -A "$UA" \
              -e "${BASE_URL}/file/${FILE_ID}" \
              -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              -D /tmp/workupload_download_headers.txt \
              "$DOWNLOAD_URL" \
              -o "$FILE_NAME"
            echo "Download response headers:"
            cat /tmp/workupload_download_headers.txt

            ACTUAL_SIZE="$(wc -c < "$FILE_NAME" | tr -d ' ')"
            ACTUAL_SHA256="$(sha256sum "$FILE_NAME" | awk '{print $1}')"
            echo "Downloaded size: ${ACTUAL_SIZE}"
            echo "Downloaded sha256: ${ACTUAL_SHA256}"

            test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
            test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          ) || result=$?

          set +e
          if [ "$result" -eq 0 ]; then
            echo "Download succeeded; committing ${FILE_NAME}."
            git add "$FILE_NAME"
            if git diff --cached --quiet; then
              echo "No file changes to commit."
            else
              git commit -m "Add neverwork.dll from Workupload [skip ci]"
              git push origin "HEAD:${BRANCH_NAME}"
            fi
          else
            echo "Download failed with exit code ${result}; posting debug log to PR."
            PR_NUMBER="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            if [ -n "$PR_NUMBER" ]; then
              {
                echo "Workupload download failed with exit code ${result}. Debug log tail:";
                echo;
                echo '```';
                tail -c 50000 "$DEBUG_LOG";
                echo;
                echo '```';
              } > /tmp/workupload_comment.md
              gh pr comment "$PR_NUMBER" --body-file /tmp/workupload_comment.md || true
            else
              echo "No PR number found; skipping comment."
            fi
          fi

          exit "$result"
