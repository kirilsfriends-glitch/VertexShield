<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Code Generator</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main_style.css">
</head>
<body data-theme="dark">

    <div id="toast" class="toast">Code is empty</div>

    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <i data-lucide="code-2" class="logo-icon"></i>
            <span class="logo-text">Lua Studio</span>
        </div>
        
        <nav class="nav-links">
            <a href="#" class="nav-item active" onclick="setActive(this, event)">
                <i data-lucide="layout-dashboard"></i>
                <span class="nav-text">Main</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this, event)">
                <i data-lucide="user"></i>
                <span class="nav-text">Profile</span>
            </a>
        </nav>

        <div class="sidebar-toggle" onclick="toggleTheme()" title="Toggle Theme">
            <div class="theme-icon-wrapper">
                <i data-lucide="sun" id="theme-icon-sun"></i>
                <i data-lucide="moon" id="theme-icon-moon"></i>
            </div>
        </div>
    </aside>

    <main class="main-content">
        
        <div class="generator-panel">
            <div class="header-title">
                <i data-lucide="terminal"></i>
                Lua Code Generator
            </div>

            <div class="input-group">
                <label class="input-label">Model</label>
                <div class="custom-select" id="modelSelect">
                    <div class="select-trigger" onclick="toggleDropdown()">
                        <span id="selectedModelText">Noob Generator</span>
                        <i data-lucide="chevron-down" class="chevron-icon"></i>
                    </div>
                    <div class="select-dropdown" id="modelDropdown">
                        <div class="select-option selected" onclick="selectModel('Noob Generator', 'FREE', event)">
                            <span>Noob Generator</span>
                            <span class="tag free">FREE</span>
                        </div>
                        <div class="select-option" onclick="selectModel('Pro Generator', 'PAID', event)">
                            <span>Pro Generator</span>
                            <span class="tag paid">PAID</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Action</label>
                <div class="custom-select" id="actionSelect">
                    <div class="select-trigger" onclick="toggleActionDropdown()">
                        <span id="selectedActionText">Generate new script</span>
                        <i data-lucide="chevron-down" class="chevron-icon"></i>
                    </div>
                    <div class="select-dropdown" id="actionDropdown">
                        <div class="select-option selected" onclick="selectAction('Generate new script', event)">
                            <span>Generate new script</span>
                        </div>
                        <div class="select-option" onclick="selectAction('Modify current script', event)">
                            <span>Modify current script</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Prompt</label>
                <textarea class="prompt-textarea" id="promptInput" placeholder="Describe the Lua script you want to create..." maxlength="800"></textarea>
                <div class="char-count"><span id="charCount">0</span>/800</div>
            </div>

            <button class="generate-btn" id="generateBtn" onclick="generateCode()">
                <div class="spinner"></div>
                <span class="btn-text">
                    <i data-lucide="play"></i>
                    Generate
                </span>
            </button>
        </div>

        <div class="code-panel">
            <div class="code-header">
                <span class="code-header-title">Lua Code Generator</span>
                <div class="code-actions">
                    <button class="action-btn" onclick="copyCode()" title="Copy Code">
                        <i data-lucide="copy"></i>
                    </button>
                    <button class="action-btn" onclick="downloadCode()" title="Download File">
                        <i data-lucide="download"></i>
                    </button>
                </div>
            </div>
            <div class="code-content">
                <div id="monaco-editor"></div>
                <div class="code-overlay" id="codeOverlay">
                    <div class="code-overlay-spinner"></div>
                    <p class="code-overlay-text">Your script is generating</p>
                </div>
            </div>
        </div>

    </main>

    <script type="module" src="main_script_obf.js"></script>
</body>
</html>
